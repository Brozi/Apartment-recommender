name: Multithread Otodom Scraper

on:
  schedule:
    - cron: '17 22 */2 * *' # Runs at 00:17 AM every two days
  workflow_dispatch:

env:
    ACTIVE_SETTINGS_JSON: ${{ secrets.SETTINGS_JSON_SPEED }}

jobs:
  prepare_discovery:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.prepare.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create settings.json
        working-directory: ./listing-scraper
        run: |
          cat << 'EOF' > settings.json
          ${{ env.ACTIVE_SETTINGS_JSON }}
          EOF

      - name: Prepare discovery shards
        id: prepare
        working-directory: ./listing-scraper
        run: python -u jobs/prepare_discovery.py
  # ==========================================
  # JOB 1: Discover the price ranges
  # ==========================================
  discover_shard:
    needs: prepare_discovery
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJson(needs.prepare_discovery.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: Create settings.json
        working-directory: ./listing-scraper
        run: |
          cat << 'EOF' > settings.json
          ${{ env.ACTIVE_SETTINGS_JSON }}
          EOF

      - name: Inject discovery shard
        working-directory: ./listing-scraper
        run: |
          python -c "
          import json
          from settings.utils import AVAILABLE_PROVINCES, PROPERTY_TYPE_MAP

          property_types = list(PROPERTY_TYPE_MAP.keys())
          property_type_id, province_id = '${{ matrix.shard }}'.split('|')

          with open('settings.json') as f:
              data = json.load(f)

          data['crawler']['property_type'] = property_types[int(property_type_id)]
          data['crawler']['province'] = AVAILABLE_PROVINCES[int(province_id)]
          data['crawler']['city'] = ''
          data['crawler']['district'] = ''

          with open('settings.json', 'w') as f:
              json.dump(data, f, indent=4)
          "

      - name: Run Discovery Script
        working-directory: ./listing-scraper
        run: python -u jobs/run_discovery.py

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ strategy.job-index }}
          path: listing-scraper/discovery_matrix.json
          retention-days: 1


  # ==========================================
  # JOB 1B: Combine all discovery shards into scrape matrix
  # ==========================================
  combine_discovery:
    needs: discover_shard
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.combine.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: discovery-*
          path: discovery_data

      - name: Combine discovery matrices
        id: combine
        run: |
          python -c "
          import glob, json, os

          chunks = []
          for path in glob.glob('discovery_data/**/discovery_matrix.json', recursive=True):
              with open(path, encoding='utf-8') as f:
                  chunks.extend(json.load(f))

          if not chunks:
              raise SystemExit('No discovery chunks were produced')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(chunks) + '\n')
          "

  # ==========================================
  # JOB 2: Run the scraper N times in parallel
  # ==========================================
  scrape_chunk:
    needs: combine_discovery
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # If one chunk fails, let the others finish
      matrix:
        chunk: ${{ fromJson(needs.combine_discovery.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create base settings.json securely
        working-directory: ./listing-scraper
        run: |
          cat << 'EOF' > settings.json
          ${{ env.ACTIVE_SETTINGS_JSON }}
          EOF

      - name: Inject scrape chunk
        working-directory: ./listing-scraper
        run: |
          python -c "
          import json
          from settings.utils import AVAILABLE_PROVINCES, PROPERTY_TYPE_MAP

          property_types = list(PROPERTY_TYPE_MAP.keys())
          property_type_id, province_id, min_val, max_val = '${{ matrix.chunk }}'.split('|')

          with open('settings.json') as f:
              data = json.load(f)

          data['crawler']['property_type'] = property_types[int(property_type_id)]
          data['crawler']['province'] = AVAILABLE_PROVINCES[int(province_id)]
          data['crawler']['city'] = ''
          data['crawler']['district'] = ''
          data['crawler']['price']['min'] = int(min_val)
          data['crawler']['price']['max'] = int(max_val)

          with open('settings.json', 'w') as f:
              json.dump(data, f, indent=4)
          "

      - name: Run the Scraper
        working-directory: ./listing-scraper
        timeout-minutes: 355
        run: python main.py

      - name: Upload Chunk Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results-${{ strategy.job-index }}
          path: |
            listing-scraper/*.csv
            listing-scraper/*.xlsx
            listing-scraper/log/scraper_log_*.txt
            listing-scraper/debug_page.html
            listing-scraper/found_investments.txt
          retention-days: 2 # Keep individual chunks for a short time to save space
  # ==========================================
  # JOB A: Discover primary investments upfront
  # ==========================================
  discover_investments:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-inv-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Create settings.json
        working-directory: ./listing-scraper
        run: |
          cat << 'EOF' > settings.json
          ${{ env.ACTIVE_SETTINGS_JSON }}
          EOF
      - name: Discover Investments
        id: set-inv-matrix
        working-directory: ./listing-scraper
        # Add PYTHONPATH=. right before python
        run: PYTHONPATH=. python -u jobs/run_inv_discovery.py

  # ==========================================
  # JOB B: Scrape primary investments (Runs in parallel with scrape_chunk)
  # ==========================================
  scrape_primary_investments:
    name: scrape_primary_investment (${{ strategy.job-index }})  # <--- ADD THIS LINE
    needs: discover_investments
    if: ${{ needs.discover_investments.outputs.matrix != '[[]]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        urls: ${{ fromJson(needs.discover_investments.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Create settings.json
        working-directory: ./listing-scraper
        run: |
          cat << 'EOF' > settings.json
          ${{ env.ACTIVE_SETTINGS_JSON }}
          EOF
      - name: Run Investment Scraper
        working-directory: ./listing-scraper
        run: PYTHONPATH=. python -u jobs/run_investments.py '${{ toJSON(matrix.urls) }}'
      - name: Upload Chunk Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
            # Prefix with scraper-results- so the merger's wildcard pattern catches it!
            name: scraper-results-inv-${{ strategy.job-index }}
            path: |
              listing-scraper/*.csv
              listing-scraper/*.xlsx
              listing-scraper/scraped_investments.txt
            retention-days: 2

  # ==========================================
  # JOB C: Compare found vs already scraped
  # ==========================================
  compare_investments:
    needs: [ scrape_chunk, scrape_primary_investments ]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all_data
      - name: Compare and Generate Leftovers
        id: compare
        run: |
          python -c "
          import glob, json, os

          found_urls = set()
          for f in glob.glob('all_data/**/found_investments.txt', recursive=True):
              with open(f, 'r') as file: found_urls.update(line.strip() for line in file if line.strip())

          scraped_urls = set()
          for f in glob.glob('all_data/**/scraped_investments.txt', recursive=True):
              with open(f, 'r') as file: scraped_urls.update(line.strip() for line in file if line.strip())

          leftovers = list(found_urls - scraped_urls)
          print(f'Found: {len(found_urls)}, Scraped: {len(scraped_urls)}, Leftovers: {len(leftovers)}')

          chunk_size = 5
          chunks = [leftovers[i:i + chunk_size] for i in range(0, len(leftovers), chunk_size)]
          if not chunks: chunks = [[]]

          with open(os.environ['GITHUB_OUTPUT'], 'a') as env:
              env.write(f'matrix={json.dumps(chunks)}\n')
          "

  # ==========================================
  # JOB D: Scrape Leftover hidden investments
  # ==========================================
  scrape_leftover_investments:
    needs: compare_investments
    if: ${{ needs.compare_investments.outputs.matrix != '[[]]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        urls: ${{ fromJson(needs.compare_investments.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Create settings.json
        working-directory: ./listing-scraper
        run: |
          cat << 'EOF' > settings.json
          ${{ env.ACTIVE_SETTINGS_JSON }}
          EOF
      - name: Run Leftover Scraper
        working-directory: ./listing-scraper
        run: python jobs/run_investments.py '${{ toJSON(matrix.urls) }}'
      - name: Upload Leftover Chunk Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results-leftover-${{ strategy.job-index }}
          path: |
            listing-scraper/*.csv
            listing-scraper/*.xlsx
            listing-scraper/scraped_investments.txt
          retention-days: 2


  # ==========================================
  # JOB 3: Merge all chunks into one final file
  # ==========================================
  merge:
    needs: [ scrape_chunk, scrape_leftover_investments ]
    if: always() # Run merge even if one chunk failed, so you don't lose data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all Chunk Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scraper-results-*
          path: all_data

      - name: Run Merge Script
        working-directory: ./listing-scraper
        # Assuming your merge runner is here
        run: python jobs/run_merge.py

      - name: Upload Final Master Files
        uses: actions/upload-artifact@v4
        with:
          name: final-scraper-results
          path: |
            listing-scraper/master_listings.csv
            listing-scraper/master_listings.xlsx
          retention-days: 7