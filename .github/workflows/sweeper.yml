name: Otodom Sweeper
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  sweeper:
    runs-on: ubuntu-latest
    env:
      ACTIVE_SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create settings.json securely
        run: |
          cat << 'EOF' > settings.json 
          ${{ env.ACTIVE_SETTINGS_JSON }}
          EOF

      - name: Run sweeper
        run: PYTHONPATH=listing-scraper python -m listing-scraper.run_sweeper
